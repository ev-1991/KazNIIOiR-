<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031d32"><title>KazIOR — Отдел цифровизации</title><style>html,body{margin:0;background:#031d32;color:#fff;font-family:Arial,sans-serif}#load{min-height:100vh;display:grid;place-items:center}#load span{opacity:.75}</style></head><body><div id="load"><span>Загрузка сайта…</span></div><script>(async()=>{try{const u=new URL('assets/html/',location.href),a=[];for(let i=1;i<=19;i++){const r=await fetch(new URL(`p${String(i).padStart(2,'0')}.txt`,u));if(!r.ok)throw Error(r.status);a.push(await r.text())}document.open();document.write(a.join(''));document.close()}catch(e){document.getElementById('load').innerHTML='<span>Ошибка загрузки сайта. Обновите страницу.</span>';console.error(e)}})();</script></body></html>
